<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automation Exercise</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Main Dashboard View -->
      <div id="mainView" class="main-view">
        <!-- Header -->
        <header class="header">
          <div class="header-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
              <path d="M2 2l7.586 7.586"></path>
              <circle cx="11" cy="11" r="2"></circle>
            </svg>
          </div>
          <div class="header-text">
            <h1>AutomationExercise</h1>
            <p>Interactive visualization of software testing categories and results</p>
          </div>
        </header>

        <!-- Stats Cards -->
        <div class="stats-grid">
          <div class="stat-card stat-total">
            <div class="stat-label">TOTAL TESTS</div>
            <div class="stat-value" id="totalTests">10</div>
          </div>
          <div class="stat-card stat-passed">
            <div class="stat-label">PASSED</div>
            <div class="stat-value" id="passedTests">6</div>
          </div>
          <div class="stat-card stat-failed">
            <div class="stat-label">FAILED</div>
            <div class="stat-value" id="failedTests">4</div>
          </div>
          <div class="stat-card stat-rate">
            <div class="stat-label">PASS RATE</div>
            <div class="stat-value" id="passRate">60%</div>
          </div>
        </div>

        <!-- Search and Filter -->
        <div class="controls">
          <div class="search-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="Search test cases..." />
          </div>
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="passed">Passed</button>
            <button class="filter-btn" data-filter="failed">Failed</button>
          </div>
        </div>

        <!-- Categories -->
        <div id="categoriesContainer" class="categories-container">
          <div id="details"></div>

        </div>
      </div>

      <!-- Detail View -->
      <div id="detailView" class="detail-view hidden">
        <div class="detail-header">
          <button id="backButton" class="back-button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Dashboard
          </button>
        </div>
        <div class="detail-content">
          <div class="detail-title-section">
            <h2 id="detailTitle"></h2>
            <span id="detailStatus" class="detail-status"></span>
          </div>
          <div class="detail-section">
            <h3>Test ID</h3>
            <div id="testId" class="detail-text"></div>
          </div>
          <div class="detail-section">
            <h3>Steps to Reproduce</h3>
            <div id="detailSteps" class="detail-text"></div>
          </div>
          <div class="detail-section">
            <h3>Expected Result</h3>
            <div id="detailExpected" class="detail-text"></div>
          </div>
          <div class="detail-section">
            <h3>Actual Result</h3>
            <div id="detailActual" class="detail-text"></div>
          </div>
          <div class="test-type">
            <h3>Test type</h3>
            <div id="detailType" class="detail-text"></div>
          </div>
          <div class="detail-section">
          </div>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
